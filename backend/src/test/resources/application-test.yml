spring:
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/asistencia_test}
    username: ${TEST_DB_USER:postgres}
    password: ${TEST_DB_PASSWORD:postgres}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
    properties.hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    clean-disabled: false
    clean-on-validation-error: true
app:
  jwt:
    secret: secreto-solo-para-tests-con-mas-de-32-bytes-de-entropia
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  notify:
    enabled: false
    from: test@ggm.edu.co
    coordination: coord@ggm.edu.co
