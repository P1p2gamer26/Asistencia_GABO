name: ci
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asistencia_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { java-version: '21', distribution: 'temurin', cache: 'maven' }
      - name: Tests del backend
        working-directory: app/backend
        env:
          TEST_DB_URL: jdbc:postgresql://localhost:5432/asistencia_test
          TEST_DB_USER: postgres
          TEST_DB_PASSWORD: postgres
        run: mvn -B verify -Dsurefire.runOrder=random

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: app/frontend/package-lock.json
      - working-directory: app/frontend
        run: npm ci && npm test && npm run build

  imagen:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # En ramas y pull requests solo se construye, para saber si el Dockerfile sigue
      # sano. Solo main publica: asi nadie despliega por error una rama a medias.
      - name: Construir
        run: docker build -t asistencia-ggm:sha-${{ github.sha }} .

      - name: Entrar al registro
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          IMG=ghcr.io/${{ github.repository_owner }}/asistencia-ggm
          IMG=$(echo "$IMG" | tr '[:upper:]' '[:lower:]')
          docker tag asistencia-ggm:sha-${{ github.sha }} "$IMG:latest"
          docker tag asistencia-ggm:sha-${{ github.sha }} "$IMG:${{ github.sha }}"
          docker push "$IMG:latest"
          docker push "$IMG:${{ github.sha }}"

  humo:
    runs-on: ubuntu-latest
    needs: [imagen]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: asistencia
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4

      # Se levanta la imagen de verdad, con el frontend dentro, para que la prueba
      # cubra tambien las rutas de la SPA. Los tres bugs mas serios del proyecto no
      # los vio ningun test unitario: los vio la aplicacion corriendo.
      - name: Construir y levantar la aplicacion
        run: |
          docker build -t asistencia-humo .
          docker run -d --name app --network host             -e DB_URL=jdbc:postgresql://localhost:5432/asistencia             -e DB_USER=postgres -e DB_PASSWORD=postgres             -e JWT_SECRET=secreto-de-integracion-continua-con-mas-de-32-bytes             -e NOTIFY_ENABLED=false             asistencia-humo

      - name: Prueba de humo
        run: bash tools/humo.sh http://localhost:8080

      - name: Registro de la aplicacion si algo fallo
        if: failure()
        run: docker logs app | tail -100
