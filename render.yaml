# Blueprint de Render: solo el servicio web (imagen del Dockerfile).
# La base de datos vive en Supabase (PostgreSQL gestionado, con backups).
# Los valores DB_* se ponen en el dashboard de Render (marcados sync:false):
#   DB_URL      jdbc:postgresql://<host-pooler>:5432/postgres?sslmode=require
#   DB_USER     postgres.<referencia-del-proyecto>
#   DB_PASSWORD <la clave del proyecto Supabase>
# Usar la cadena del Session pooler (puerto 5432), NO la del Transaction pooler (6543):
# esa ultima rompe los prepared statements de Hibernate de forma intermitente.
services:
  - type: web
    name: asistencia-ggm
    runtime: docker
    branch: main          # produccion sale SOLO de main; develop no despliega
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true          # secreto aleatorio, distinto del de desarrollo
      - key: NOTIFY_ENABLED
        value: "false"
