spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/asistencia}
    username: ${DB_USER:asistencia}
    password: ${DB_PASSWORD:asistencia}
  jpa:
    hibernate.ddl-auto: validate
    open-in-view: false
  flyway.enabled: true
  jackson.default-property-inclusion: non_null
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
    properties.mail.smtp.starttls.enable: ${MAIL_TLS:false}
app:
  jwt:
    secret: ${JWT_SECRET:cambiar-en-produccion-minimo-32-bytes-de-entropia}
    access-ttl-minutes: 60
    refresh-ttl-days: 30
  notify:
    enabled: ${NOTIFY_ENABLED:false}
    from: ${MAIL_FROM:no-reply@ggm.edu.co}
    coordination: ${MAIL_COORDINACION:coord@ggm.edu.co}
server:
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 512

management:
  health:
    # El indicador de correo intenta conectarse al SMTP y, si no responde, marca TODA
    # la aplicacion como caida (503). Un orquestador o balanceador la reiniciaria en
    # bucle aunque tomar asistencia -que es lo critico- funcione perfectamente.
    # Los fallos de envio ya quedan registrados con su motivo en la tabla
    # notifications, que es donde hay que mirarlos, no en una sonda de vida.
    mail.enabled: false
